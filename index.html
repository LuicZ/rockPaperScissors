<!DOCTYPE html>
<html lang = "en">
<head> 
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <meta name = "author" content = "Christophe Brown">
    <meta name = "description" content = "A simple rock paper scissors game">
    <link rel = "stylesheet" href = "style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src = "index.js" defer> </script>
    <title>Rock Paper Scissors</title>
    </head>
    <body> 
        <div class = "desc">
       <h1 class = "title">ROCK · PAPER · SCISSORS</h1>
       <h2 class = "instructions"> First to 5 wins! </h2>
</div>
<div class ="scoreboard"> 
    <h2 id = 'player-score'>  You: 0 </h2>
    <h2 id = 'computer-score'> Computer: 0 </h2>
    </div>
        <div class = "game">
        <p> Choose your weapon: </p>
        <div class = "weapons">
        <button id = "rock"> 🪨 </button>
        <button id = "paper">  📄 </button>
        <button id = "scissors"> ✂️ </button>
        </div>
        <div class = 'results'>
            <p id = "user"> You chose: </p>
            <p id = "computer"> Computer chose: </p>
            <p class = "winner"> </p>
        </div>

        <div class = "last-round-winner">
            <p id = "last-winner"> </p>
        </div>
        </body>
        </html>
